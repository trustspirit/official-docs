name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: church-docs-official

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/functions/requirements.txt

      - name: Check backend imports
        working-directory: apps/functions
        run: |
          pip install -r requirements.txt
          python -c "import ast,sys; [ast.parse(open(f).read(), f) for f in ['main.py','auth.py','ai.py','sanitize.py','storage_utils.py','contacts.py','mailer.py']]"

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # lockfile에 고정된 firebase-tools만 사용 (레지스트리에서 임의 버전을 받지 않도록)
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # Firebase CLI가 Python 함수를 찾으려면 apps/functions/venv 가 필요합니다.
      - name: Prepare functions venv
        working-directory: apps/functions
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: npx --no-install firebase deploy --project "$FIREBASE_PROJECT" --non-interactive
